name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check packages examples

      - name: Test
        run: uv run pytest -q

  smokes:
    name: offline smokes
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: smoke_dry_run
        run: uv run python scripts/smoke_dry_run.py

      - name: smoke_mutation_test
        run: uv run python scripts/smoke_mutation_test.py

      - name: smoke_rft_passthrough
        run: uv run python scripts/smoke_rft_passthrough.py

      - name: smoke_kappa_tracking
        run: uv run python scripts/smoke_kappa_tracking.py

      - name: smoke_e2b_sandbox
        run: uv run python scripts/smoke_e2b_sandbox.py

      - name: smoke_eval
        run: uv run python scripts/smoke_eval.py

      - name: eval demo transcript (byte-exact)
        run: scripts/demo_eval.sh --check

      - name: smoke_compile_targets
        run: uv run python scripts/smoke_compile_targets.py

      - name: smoke_label
        run: uv run python scripts/smoke_label.py

      - name: smoke_mutate_classification
        run: uv run python scripts/smoke_mutate_classification.py

      - name: RFT demo transcript (byte-exact)
        run: scripts/demo.sh --check

  label-docker:
    name: label connectors (Postgres, MySQL, S3 via docker compose)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Start test services
        run: docker compose -f packages/label/docker/compose.yml -p caliper-label-test up -d --wait

      - name: Docker-gated tests
        run: uv run pytest -m docker -q

      - name: Service logs on failure
        if: failure()
        run: docker compose -f packages/label/docker/compose.yml -p caliper-label-test logs --tail 100

      - name: Stop test services
        if: always()
        run: docker compose -f packages/label/docker/compose.yml -p caliper-label-test down -v

  label-e2e:
    name: label e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/label/e2e/package-lock.json

      - name: Install e2e deps
        working-directory: packages/label/e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: packages/label/e2e
        run: npx playwright install --with-deps chromium

      - name: Start Postgres for the gated wizard test
        run: docker compose -f packages/label/docker/compose.yml -p caliper-label-e2e up -d --wait postgres

      - name: e2e suite
        env:
          CALIPER_LABEL_E2E_DOCKER: "1"
          E2E_SKIP_INSTALL: "1"
        run: scripts/e2e_label.sh

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: label-e2e-report
          path: |
            packages/label/e2e/playwright-report
            packages/label/e2e/test-results
          retention-days: 7

      - name: Stop test services
        if: always()
        run: docker compose -f packages/label/docker/compose.yml -p caliper-label-e2e down -v

  editor:
    name: editor typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packages/editor/pnpm-lock.yaml

      - name: Install editor deps
        run: pnpm --dir packages/editor install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir packages/editor typecheck

      - name: Build
        run: pnpm --dir packages/editor build
