name: Deploy Docs

# caliper.orlalabs.com: the Starlight site in site/, built from docs/*.md and the
# example READMEs (site/scripts/sync-docs.mjs), deployed to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/*/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install docs dependencies
        working-directory: site
        run: npm ci

      - name: Build docs
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
