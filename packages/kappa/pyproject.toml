[project]
name = "caliper-kappa"
version = "0.0.1"
description = "Agreement statistics: Cohen's kappa grader-vs-labels, and inter-rater kappa (Cohen's/Fleiss') by category."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "caliper-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper_kappa"]
