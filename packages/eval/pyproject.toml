[project]
name = "caliper-eval"
version = "0.0.1"
description = "Evaluate and regression-test an LLM feature in CI: candidates, noise floor, transitions, calibration."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "caliper-sdk",
    "caliper-kappa",
    "httpx>=0.27",  # openai_compat provider (plain HTTP)
]

[project.optional-dependencies]
# Real providers are optional; core + fake provider run fully offline.
# AnthropicBedrockMantle verified present in anthropic 2.6.0 (2026-11-06).
anthropic = ["anthropic>=2.6,<3"]
bedrock = ["anthropic[bedrock]>=2.6,<3"]

[project.scripts]
caliper = "caliper_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper_eval"]
