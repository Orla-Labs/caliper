[project]
name = "caliper-rft"
version = "0.0.1"
description = "Compile Caliper graders to training targets (TRL, Bedrock RFT, legacy OpenAI RFT)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "caliper-sdk",
]

[project.scripts]
caliper-compile = "caliper_rft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper_rft"]
