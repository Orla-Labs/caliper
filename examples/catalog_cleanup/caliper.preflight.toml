# A candidate shape the fake provider refuses: fake-small with thinking on AND
# provider-native json_schema output. `caliper eval` runs a preflight request
# per candidate first and stops here, before spending anything on the golden
# set. Kept out of caliper.toml so the main demo passes preflight.
#
#   uv run caliper eval --config examples/catalog_cleanup/caliper.preflight.toml --out build/catalog-preflight

golden = "golden.jsonl"
decide = "decide.py:decide"
reference = "baseline"
noise_replays = 2
budget_usd = 2.0
seed = 0

[[candidates]]
name = "baseline"
provider = "fake"
model = "fake-large"
fake_script = "fake_models.py:respond"
replies_per_row = 3

[[candidates]]
name = "small-thinking-schema"
provider = "fake"
model = "fake-small"
thinking = "on"
output_mode = "json_schema"
fake_script = "fake_models.py:respond"
replies_per_row = 3

[candidates.output_schema]
type = "object"
required = ["description", "specs", "tax_code", "confidence"]
additionalProperties = false

[candidates.output_schema.properties.description]
type = "string"

[candidates.output_schema.properties.specs]
type = "object"

[candidates.output_schema.properties.tax_code]
type = "string"

[candidates.output_schema.properties.confidence]
type = "number"

[pricing."fake-large"]
input = 3.0
output = 15.0

[pricing."fake-small"]
input = 0.8
output = 4.0
