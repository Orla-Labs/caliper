# The published distribution, `orlalabs-caliper`, is built from this file: one wheel holding
# every workspace package below (import names caliper_eval, caliper_label, ... unchanged).
# The workspace members' own pyproject files are for local development only.
[project]
name = "orlalabs-caliper"
version = "0.1.2"
description = "Know when a model or prompt change breaks your AI feature, before your users do: replay a golden set, measure against replay noise, gate CI on regression and cost."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Orla Labs" }]
keywords = ["llm", "evaluation", "evals", "ci", "regression-testing", "labeling", "rlhf", "grader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dynamic = ["readme"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Model providers for `caliper eval` (core + the fake provider run fully offline).
anthropic = ["anthropic>=2.6,<3"]
bedrock = ["anthropic[bedrock]>=2.6,<3"]
bedrock-converse = ["boto3>=1.40"]
# `caliper label`: the local labelling UI and its data connectors.
label = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "duckdb>=1.2",
    "boto3>=1.34",
    "pytz>=2024.1",
]
# `caliper-server`: the grader API and its store.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
e2b = ["e2b-code-interpreter>=1.0"]
all = ["orlalabs-caliper[anthropic,bedrock,bedrock-converse,label,server,postgres]"]

[project.scripts]
caliper = "caliper_eval.cli:main"
caliper-compile = "caliper_rft.cli:main"
caliper-server = "caliper_server.cli:main"

[project.urls]
Homepage = "https://github.com/Orla-Labs/caliper"
Documentation = "https://caliper.orlalabs.com"
Source = "https://github.com/Orla-Labs/caliper"
Issues = "https://github.com/Orla-Labs/caliper/issues"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/sdk/src/caliper_sdk",
    "packages/kappa/src/caliper_kappa",
    "packages/eval/src/caliper_eval",
    "packages/label/src/caliper_label",
    "packages/rft_compile/src/caliper_rft",
    "packages/mutate/src/caliper_mutate",
    "packages/differ/src/caliper_differ",
    "packages/monitor/src/caliper_monitor",
    "packages/store/src/caliper_store",
    "packages/server/src/caliper_server",
]

# Example projects for `caliper example` (tests, generators and the demo transcript stay out).
[tool.hatch.build.targets.wheel.force-include]
"examples/catalog_cleanup/README.md" = "caliper_eval/_examples/catalog_cleanup/README.md"
"examples/catalog_cleanup/caliper.preflight.toml" = "caliper_eval/_examples/catalog_cleanup/caliper.preflight.toml"
"examples/catalog_cleanup/caliper.real.toml" = "caliper_eval/_examples/catalog_cleanup/caliper.real.toml"
"examples/catalog_cleanup/caliper.toml" = "caliper_eval/_examples/catalog_cleanup/caliper.toml"
"examples/catalog_cleanup/decide.py" = "caliper_eval/_examples/catalog_cleanup/decide.py"
"examples/catalog_cleanup/fake_models.py" = "caliper_eval/_examples/catalog_cleanup/fake_models.py"
"examples/catalog_cleanup/feature_rule.py" = "caliper_eval/_examples/catalog_cleanup/feature_rule.py"
"examples/catalog_cleanup/golden.jsonl" = "caliper_eval/_examples/catalog_cleanup/golden.jsonl"
"examples/catalog_cleanup/label.yaml" = "caliper_eval/_examples/catalog_cleanup/label.yaml"
"examples/catalog_cleanup/logs.jsonl" = "caliper_eval/_examples/catalog_cleanup/logs.jsonl"
"examples/invoice_totals/README.md" = "caliper_eval/_examples/invoice_totals/README.md"
"examples/invoice_totals/check.py" = "caliper_eval/_examples/invoice_totals/check.py"
"examples/invoice_totals/graders.py" = "caliper_eval/_examples/invoice_totals/graders.py"
"examples/invoice_totals/labeled_rollouts.jsonl" = "caliper_eval/_examples/invoice_totals/labeled_rollouts.jsonl"
"examples/invoice_totals/prompts.jsonl" = "caliper_eval/_examples/invoice_totals/prompts.jsonl"
"examples/catalog_cleanup/cards" = "caliper_eval/_examples/catalog_cleanup/cards"

[tool.hatch.build.targets.sdist]
include = [
    "packages/*/src/**",
    "examples/catalog_cleanup/**",
    "examples/invoice_totals/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["packages/editor"]

# PyPI does not resolve relative links: point README links and images at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")(?:\./)?(?!https?://|#|mailto:)([^)"]+\.(?:png|gif|jpg|svg))'
replacement = '\1https://raw.githubusercontent.com/Orla-Labs/caliper/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?:\./)?(?!https?://|#|mailto:)([^)]+)'
replacement = '\1https://github.com/Orla-Labs/caliper/blob/main/\2'

[tool.uv]
# Dev installs come from the workspace members; this root only builds the release wheel.
package = false

[tool.uv.workspace]
members = [
    "packages/sdk",
    "packages/rft_compile",
    "packages/differ",
    "packages/monitor",
    "packages/mutate",
    "packages/kappa",
    "packages/store",
    "packages/server",
    "packages/eval",
    "packages/label",
]

[tool.uv.sources]
caliper-sdk = { workspace = true }
caliper-rft = { workspace = true }
caliper-differ = { workspace = true }
caliper-monitor = { workspace = true }
caliper-mutate = { workspace = true }
caliper-kappa = { workspace = true }
caliper-store = { workspace = true }
caliper-server = { workspace = true }
caliper-eval = { workspace = true }
caliper-label = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "caliper-sdk",
    "caliper-rft",
    "caliper-differ",
    "caliper-monitor",
    "caliper-mutate",
    "caliper-kappa",
    "caliper-store",
    "caliper-server",
    "caliper-eval",
    "caliper-label",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N"]
# The label data layer builds DuckDB/SQLite SQL from config-owned table names and queries; every
# value is quoted with lit()/ident() or bound as a parameter (see connectors/duck.py).
"packages/label/src/caliper_label/{connectors/duck.py,project_store.py,snapshot.py,sinks.py}" = [
    "S608",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/sdk/tests",
    "packages/rft_compile/tests",
    "packages/differ/tests",
    "packages/monitor/tests",
    "packages/mutate/tests",
    "packages/kappa/tests",
    "packages/store/tests",
    "packages/server/tests",
    "packages/eval/tests",
    "packages/label/tests",
    "examples/catalog_cleanup/tests",
]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not docker and not slow'"
markers = [
    "docker: needs the label test services (docker compose); run with -m docker",
    "slow: large-data tests (e.g. 1M-row Parquet); run with -m slow",
]
